<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sunny Sums">
<title>Sunny Sums</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:"Arial Rounded MT Bold", "Trebuchet MS", -apple-system, Helvetica, Arial, sans-serif;
    background:#EAF6FC;
    color:#1E3A5F;
    -webkit-user-select:none; user-select:none;
    -webkit-text-size-adjust:100%;
  }
  .screen { display:none; min-height:100%; padding:20px 16px 32px; max-width:520px; margin:0 auto; }
  .screen.on { display:block; }

  /* ---------- start screen ---------- */
  .sun {
    width:110px; height:110px; margin:28px auto 6px; position:relative;
    background:#FFC93C; border-radius:50%;
    box-shadow:0 0 0 14px rgba(255,201,60,.35), 0 0 0 28px rgba(255,201,60,.15);
  }
  .sun:before, .sun:after { content:""; position:absolute; background:#1E3A5F; border-radius:6px; }
  .sun:before { width:10px; height:16px; left:32px; top:38px; }
  .sun:after  { width:10px; height:16px; right:32px; top:38px; }
  .sun .smile { position:absolute; left:34px; right:34px; bottom:26px; height:18px;
    border:5px solid #1E3A5F; border-top:none; border-radius:0 0 22px 22px; }
  h1 { text-align:center; font-size:34px; margin:14px 0 2px; letter-spacing:.5px; }
  .tagline { text-align:center; font-size:16px; color:#4A6B8A; margin-bottom:24px; }
  .status-line { text-align:center; font-size:17px; margin-bottom:20px; min-height:22px; }

  .bigbtn {
    display:block; width:100%; border:none; cursor:pointer;
    background:#FFC93C; color:#1E3A5F;
    font-family:inherit; font-size:24px; padding:18px; border-radius:20px;
    box-shadow:0 5px 0 #E0A81C; margin-bottom:14px;
  }
  .bigbtn:active { -webkit-transform:translateY(3px); transform:translateY(3px); box-shadow:0 2px 0 #E0A81C; }
  .bigbtn.quiet { background:#FFFFFF; box-shadow:0 5px 0 #C9DEEA; font-size:19px; padding:14px; }
  .bigbtn:disabled { opacity:.45; }

  /* ---------- practice screen ---------- */
  .topbar { font-size:16px; color:#4A6B8A; text-align:center; margin-bottom:10px; }
  .problem {
    text-align:center; font-size:64px; margin:10px 0 4px; min-height:76px;
  }
  .answer-slot { display:inline-block; min-width:76px; border-bottom:6px solid #1E3A5F; }
  .answer-slot.empty { color:#B8D3E3; }
  .timerwrap { height:12px; background:#FFFFFF; border-radius:6px; overflow:hidden; margin:12px 24px 6px; }
  .timerbar { height:100%; width:100%; background:#4CAF7D; }
  .timerbar.low { background:#F26B5E; }
  .feedback { text-align:center; font-size:24px; min-height:34px; margin:6px 0 8px; }
  .feedback.good { color:#2E8A5C; }
  .feedback.bad  { color:#D94F42; }

  .pad { max-width:340px; margin:0 auto; }
  .pad-row { text-align:center; margin-bottom:12px; }
  .key {
    display:inline-block; vertical-align:top; width:88px; height:74px; margin:0 6px;
    border:none; border-radius:18px; cursor:pointer;
    background:#FFFFFF; color:#1E3A5F;
    font-family:inherit; font-size:32px;
    box-shadow:0 4px 0 #C9DEEA;
  }
  .key:active { -webkit-transform:translateY(3px); transform:translateY(3px); box-shadow:0 1px 0 #C9DEEA; }
  .key.go { background:#4CAF7D; color:#FFFFFF; box-shadow:0 4px 0 #37855F; }
  .key.del { background:#F4E9D8; font-size:26px; }

  /* ---------- report ---------- */
  h2 { text-align:center; font-size:26px; margin:18px 0 4px; }
  .score-line { text-align:center; font-size:19px; color:#4A6B8A; margin-bottom:16px; }
  .report-list { background:#FFFFFF; border-radius:16px; padding:10px 14px; margin-bottom:18px; }
  .report-item { padding:9px 2px; border-bottom:2px solid #EAF6FC; font-size:19px; }
  .report-item:last-child { border-bottom:none; }
  .report-item .mark { display:inline-block; width:30px; }
  .report-item.good .mark { color:#2E8A5C; }
  .report-item.bad  .mark { color:#D94F42; }
  .report-item .fix { float:right; color:#4A6B8A; font-size:16px; padding-top:2px; }

  /* ---------- calendar ---------- */
  .cal-head { text-align:center; font-size:20px; margin:6px 0 12px; }
  .cal-head button { border:none; background:none; font-family:inherit; font-size:22px; color:#1E3A5F; cursor:pointer; padding:2px 14px; }
  table.cal { width:100%; border-collapse:collapse; table-layout:fixed; margin-bottom:16px; }
  table.cal th { font-size:13px; color:#4A6B8A; padding-bottom:6px; font-weight:normal; }
  table.cal td { text-align:center; padding:3px 0; }
  .day {
    display:inline-block; width:38px; height:38px; line-height:38px;
    border-radius:50%; font-size:16px; background:#FFFFFF; color:#1E3A5F;
  }
  .day.none  { background:none; }
  .day.green { background:#4CAF7D; color:#FFFFFF; }
  .day.orange{ background:#F5A83C; color:#FFFFFF; }
  .day.red   { background:#F26B5E; color:#FFFFFF; }
  .day.today { border:3px solid #1E3A5F; line-height:32px; }
  .legend { text-align:center; font-size:14px; color:#4A6B8A; margin-bottom:18px; line-height:1.9; }
  .dot { display:inline-block; width:13px; height:13px; border-radius:50%; margin:0 4px 0 12px; vertical-align:-1px; }
  .dot.g{background:#4CAF7D} .dot.o{background:#F5A83C} .dot.r{background:#F26B5E}

  /* ---------- settings ---------- */
  .set-row { background:#FFFFFF; border-radius:16px; padding:16px; margin-bottom:14px; font-size:18px; }
  .set-row .label { margin-bottom:10px; }
  .stepper { text-align:center; }
  .stepper button {
    border:none; border-radius:14px; width:60px; height:52px; font-family:inherit;
    font-size:26px; background:#EAF6FC; color:#1E3A5F; cursor:pointer; vertical-align:middle;
  }
  .stepper .val { display:inline-block; width:110px; text-align:center; font-size:24px; vertical-align:middle; }
  .warn { background:#FFF3D6; border-radius:14px; padding:12px 14px; font-size:15px; color:#7A5A12; margin-bottom:14px; display:none; }

  /* fatal error display instead of a blank page */
  #fatal { display:none; position:fixed; left:0; right:0; top:0; background:#D94F42; color:#fff;
    font-family:monospace; font-size:13px; padding:10px; z-index:99; white-space:pre-wrap; }
</style>
</head>
<body>

<div id="fatal"></div>

<!-- START -->
<div class="screen on" id="scr-home">
  <div class="sun"><div class="smile"></div></div>
  <h1>Sunny Sums</h1>
  <div class="tagline">50 sums a day keeps the clouds away</div>
  <div class="warn" id="persist-warn">Heads up: progress can't be saved in this browser, so today's work will disappear when the page closes.</div>
  <div class="status-line" id="home-status"></div>
  <button class="bigbtn" id="btn-start">Start today's practice</button>
  <button class="bigbtn quiet" id="btn-cal">Calendar</button>
  <button class="bigbtn quiet" id="btn-report-home" style="display:none">Today's report</button>
  <button class="bigbtn quiet" id="btn-settings">Settings</button>
</div>

<!-- PRACTICE -->
<div class="screen" id="scr-play">
  <div class="topbar" id="play-progress"></div>
  <div class="problem" id="problem-text"></div>
  <div class="timerwrap"><div class="timerbar" id="timerbar"></div></div>
  <div class="feedback" id="feedback"></div>
  <div class="pad">
    <div class="pad-row">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
    </div>
    <div class="pad-row">
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
    </div>
    <div class="pad-row">
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
    </div>
    <div class="pad-row">
      <button class="key del" data-k="del">&#9003;</button><button class="key" data-k="0">0</button><button class="key go" data-k="ok">OK</button>
    </div>
  </div>
</div>

<!-- REPORT -->
<div class="screen" id="scr-report">
  <h2>Today's report</h2>
  <div class="score-line" id="report-score"></div>
  <div class="report-list" id="report-list"></div>
  <button class="bigbtn quiet" id="btn-report-back">Back to start</button>
</div>

<!-- CALENDAR -->
<div class="screen" id="scr-cal">
  <div class="cal-head">
    <button id="cal-prev">&#8249;</button>
    <span id="cal-title"></span>
    <button id="cal-next">&#8250;</button>
  </div>
  <table class="cal">
    <thead><tr><th>S</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th></tr></thead>
    <tbody id="cal-body"></tbody>
  </table>
  <div class="legend">
    <span class="dot g"></span>all correct
    <span class="dot o"></span>some wrong
    <span class="dot r"></span>not practiced
  </div>
  <button class="bigbtn quiet" id="btn-cal-back">Back to start</button>
</div>

<!-- SETTINGS -->
<div class="screen" id="scr-set">
  <h2>Settings</h2>
  <div class="set-row">
    <div class="label">Seconds to answer each sum</div>
    <div class="stepper">
      <button id="t-minus">&#8722;</button>
      <span class="val" id="t-val"></span>
      <button id="t-plus">+</button>
    </div>
  </div>
  <button class="bigbtn quiet" id="btn-set-back">Back to start</button>
</div>

<script>
/* Sunny Sums v2 — self-contained, ES5-only for older iPad Safari.
   Storage tiers: localStorage (self-hosted) -> Claude artifact storage -> in-memory. */

window.onerror = function (msg, src, line) {
  var f = document.getElementById("fatal");
  f.style.display = "block";
  f.textContent = "Something broke: " + msg + " (line " + line + ")";
};

(function () {
  "use strict";

  var STORE_KEY = "sunny-sums-v1";
  var DAILY_COUNT = 50;
  var STREAK_TO_CLEAR = 2;      /* correct on 2 different days => mastered */
  var FEEDBACK_GOOD_MS = 700;
  var FEEDBACK_BAD_MS = 1800;

  /* ---------- storage: localStorage -> Claude cloud -> memory ---------- */
  var mem = {};
  function localOk() {
    try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; }
    catch (e) { return false; }
  }
  function cloudOk() {
    try { return !!(window.storage && typeof window.storage.get === "function"); }
    catch (e) { return false; }
  }
  function sGet(k, cb) {
    if (localOk()) { cb(localStorage.getItem(k)); return; }
    if (cloudOk()) {
      window.storage.get(k).then(function (r) { cb(r ? r.value : null); },
                                 function () { cb(null); });
      return;
    }
    cb(mem[k] !== undefined ? mem[k] : null);
  }
  function sSet(k, v) {
    if (localOk()) { try { localStorage.setItem(k, v); } catch (e) {} return; }
    if (cloudOk()) { try { window.storage.set(k, v); } catch (e) {} return; }
    mem[k] = v;
  }
  function canPersist() { return localOk() || cloudOk(); }

  /* ---------- state ---------- */
  var db = null;        /* { settings, days, wrongBank, session } */
  var timerId = null;
  var timerEndsAt = 0;
  var locked = false;   /* input locked during feedback */

  function freshDb() {
    return {
      settings: { timerSec: 5 },
      days: {},          /* "2026-08-31": {total, correct, wrongList:[{q,a,given}]} */
      wrongBank: {},     /* "3+5": {streak, lastDay} */
      session: null      /* in-progress day, survives accidental close */
    };
  }
  function save() { sSet(STORE_KEY, JSON.stringify(db)); }

  function todayKey() {
    var d = new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" + m : m) + "-" + (day < 10 ? "0" + day : day);
  }

  /* ---------- problem generation ---------- */
  function buildSession() {
    var problems = [];
    var seen = {};
    var key;

    /* 1) resurface unmastered wrong answers from previous days */
    for (key in db.wrongBank) {
      if (db.wrongBank.hasOwnProperty(key) && problems.length < DAILY_COUNT) {
        var parts = key.split("+");
        problems.push({ x: parseInt(parts[0], 10), y: parseInt(parts[1], 10), review: true });
        seen[key] = true;
      }
    }
    /* 2) fill with random sums, avoiding same-day repeats where possible */
    var guard = 0;
    while (problems.length < DAILY_COUNT) {
      var x = 1 + Math.floor(Math.random() * 9);
      var y = 1 + Math.floor(Math.random() * 9);
      key = x + "+" + y;
      guard++;
      if (seen[key] && guard < 400) continue;
      seen[key] = true;
      problems.push({ x: x, y: y, review: false });
    }
    /* shuffle so review sums are mixed in */
    for (var i = problems.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = problems[i]; problems[i] = problems[j]; problems[j] = t;
    }
    return { day: todayKey(), idx: 0, correct: 0, problems: problems, results: [] };
  }

  /* ---------- screens ---------- */
  function show(id) {
    var scrs = document.getElementsByClassName("screen");
    for (var i = 0; i < scrs.length; i++) scrs[i].className = "screen";
    document.getElementById(id).className = "screen on";
  }

  function renderHome() {
    var t = todayKey();
    var status = document.getElementById("home-status");
    var startBtn = document.getElementById("btn-start");
    var reportBtn = document.getElementById("btn-report-home");
    var done = db.days[t];
    var pending = (db.session && db.session.day === t) ? db.session : null;

    if (done) {
      status.textContent = "All done today: " + done.correct + " / " + done.total + " correct" +
        (done.correct === done.total ? "  \u2B50" : "");
      startBtn.textContent = "Practice again (extra round)";
      reportBtn.style.display = "block";
    } else if (pending) {
      status.textContent = "Paused at sum " + (pending.idx + 1) + " of " + DAILY_COUNT;
      startBtn.textContent = "Keep going";
      reportBtn.style.display = "none";
    } else {
      var reviewCount = 0;
      for (var k in db.wrongBank) if (db.wrongBank.hasOwnProperty(k)) reviewCount++;
      status.textContent = reviewCount > 0
        ? reviewCount + " sum" + (reviewCount === 1 ? "" : "s") + " to win back today"
        : "Ready when you are!";
      startBtn.textContent = "Start today's practice";
      reportBtn.style.display = "none";
    }
    document.getElementById("persist-warn").style.display = canPersist() ? "none" : "block";
    show("scr-home");
  }

  /* ---------- practice flow ---------- */
  var typed = "";

  function startPractice() {
    var t = todayKey();
    if (!(db.session && db.session.day === t)) {
      db.session = buildSession();
      save();
    }
    typed = "";
    show("scr-play");
    askCurrent();
  }

  function askCurrent() {
    var s = db.session;
    if (!s || s.idx >= s.problems.length) { finishSession(); return; }
    locked = false;
    typed = "";
    var p = s.problems[s.idx];
    document.getElementById("play-progress").textContent =
      "Sum " + (s.idx + 1) + " of " + s.problems.length + (p.review ? "  \u2022  win it back!" : "");
    document.getElementById("feedback").textContent = "";
    document.getElementById("feedback").className = "feedback";
    drawProblem();
    startTimer();
  }

  function drawProblem() {
    var p = db.session.problems[db.session.idx];
    var slot = typed === ""
      ? '<span class="answer-slot empty">?</span>'
      : '<span class="answer-slot">' + typed + "</span>";
    document.getElementById("problem-text").innerHTML = p.x + " + " + p.y + " = " + slot;
  }

  function startTimer() {
    stopTimer();
    var secs = db.settings.timerSec;
    timerEndsAt = new Date().getTime() + secs * 1000;
    var bar = document.getElementById("timerbar");
    bar.className = "timerbar";
    bar.style.width = "100%";
    timerId = setInterval(function () {
      var left = timerEndsAt - new Date().getTime();
      if (left <= 0) { stopTimer(); bar.style.width = "0%"; answer(null); return; }
      var pct = left / (secs * 1000) * 100;
      bar.style.width = pct + "%";
      bar.className = pct < 30 ? "timerbar low" : "timerbar";
    }, 100);
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  function keyPress(k) {
    if (locked) return;
    if (k === "del") { typed = typed.slice(0, -1); drawProblem(); return; }
    if (k === "ok") { if (typed !== "") answer(parseInt(typed, 10)); return; }
    if (typed.length < 2) { typed += k; drawProblem(); }
  }

  function answer(given) {
    stopTimer();
    locked = true;
    var s = db.session;
    var p = s.problems[s.idx];
    var right = p.x + p.y;
    var good = (given === right);
    var fb = document.getElementById("feedback");
    var key = p.x + "+" + p.y;
    var t = todayKey();

    s.results.push({ q: p.x + " + " + p.y, a: right, given: given, good: good, review: p.review });

    if (good) {
      s.correct++;
      fb.textContent = "\u2713  Yes!";
      fb.className = "feedback good";
      /* progress toward mastery for review sums */
      if (db.wrongBank[key]) {
        var bank = db.wrongBank[key];
        if (bank.lastDay !== t) { bank.streak++; bank.lastDay = t; }
        if (bank.streak >= STREAK_TO_CLEAR) delete db.wrongBank[key];
      }
    } else {
      fb.textContent = (given === null ? "\u23F0 Time's up! " : "\u2717 ") + p.x + " + " + p.y + " = " + right;
      fb.className = "feedback bad";
      db.wrongBank[key] = { streak: 0, lastDay: null };
    }

    s.idx++;
    save();
    setTimeout(askCurrent, good ? FEEDBACK_GOOD_MS : FEEDBACK_BAD_MS);
  }

  function finishSession() {
    var s = db.session;
    if (!s) { renderHome(); return; }
    var t = s.day;
    /* keep the better score if practicing an extra round */
    var prev = db.days[t];
    if (!prev || s.correct > prev.correct) {
      db.days[t] = { total: s.problems.length, correct: s.correct, results: s.results };
    }
    db.session = null;
    save();
    renderReport(db.days[t]);
  }

  function renderReport(day) {
    document.getElementById("report-score").textContent =
      day.correct + " out of " + day.total + " correct" +
      (day.correct === day.total ? "  \u2B50 Perfect day!" : "");
    var list = document.getElementById("report-list");
    var html = "";
    for (var i = 0; i < day.results.length; i++) {
      var r = day.results[i];
      html += '<div class="report-item ' + (r.good ? "good" : "bad") + '">' +
        '<span class="mark">' + (r.good ? "\u2713" : "\u2717") + "</span>" +
        r.q + " = " + r.a +
        (r.good ? "" : '<span class="fix">' +
          (r.given === null ? "ran out of time" : "answered " + r.given) + "</span>") +
        "</div>";
    }
    list.innerHTML = html;
    show("scr-report");
  }

  /* ---------- calendar ---------- */
  var calY, calM;
  function openCal() {
    var d = new Date();
    calY = d.getFullYear(); calM = d.getMonth();
    drawCal();
    show("scr-cal");
  }
  function drawCal() {
    var names = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    document.getElementById("cal-title").textContent = names[calM] + " " + calY;
    var first = new Date(calY, calM, 1).getDay();
    var count = new Date(calY, calM + 1, 0).getDate();
    var today = new Date(); today.setHours(0,0,0,0);
    var tKey = todayKey();
    var html = "<tr>", cell = 0, d;

    for (d = 0; d < first; d++) { html += '<td><span class="day none"></span></td>'; cell++; }
    for (d = 1; d <= count; d++) {
      var m = calM + 1;
      var key = calY + "-" + (m < 10 ? "0" + m : m) + "-" + (d < 10 ? "0" + d : d);
      var rec = db.days[key];
      var cls = "day";
      var thisDate = new Date(calY, calM, d);
      if (rec) cls += rec.correct === rec.total ? " green" : " orange";
      else if (thisDate < today) cls += " red";
      if (key === tKey) cls += " today";
      html += '<td><span class="' + cls + '">' + d + "</span></td>";
      cell++;
      if (cell % 7 === 0 && d < count) html += "</tr><tr>";
    }
    html += "</tr>";
    document.getElementById("cal-body").innerHTML = html;
  }

  /* ---------- settings ---------- */
  function drawTimerVal() {
    document.getElementById("t-val").textContent = db.settings.timerSec + " sec";
  }
  function bumpTimer(delta) {
    var v = db.settings.timerSec + delta;
    if (v < 2) v = 2;
    if (v > 60) v = 60;
    db.settings.timerSec = v;
    save();
    drawTimerVal();
  }

  /* ---------- wiring ---------- */
  function on(id, fn) { document.getElementById(id).onclick = fn; }

  function boot() {
    sGet(STORE_KEY, function (raw) {
      db = freshDb();
      if (raw) {
        try {
          var loaded = JSON.parse(raw);
          if (loaded && loaded.settings) db = loaded;
          if (!db.wrongBank) db.wrongBank = {};
          if (!db.days) db.days = {};
        } catch (e) {}
      }
      /* drop a stale unfinished session from a previous day */
      if (db.session && db.session.day !== todayKey()) { db.session = null; save(); }

      on("btn-start", startPractice);
      on("btn-cal", openCal);
      on("btn-cal-back", renderHome);
      on("btn-settings", function () { drawTimerVal(); show("scr-set"); });
      on("btn-set-back", renderHome);
      on("btn-report-back", renderHome);
      on("btn-report-home", function () {
        var rec = db.days[todayKey()];
        if (rec) renderReport(rec);
      });
      on("cal-prev", function () { calM--; if (calM < 0) { calM = 11; calY--; } drawCal(); });
      on("cal-next", function () { calM++; if (calM > 11) { calM = 0; calY++; } drawCal(); });
      on("t-minus", function () { bumpTimer(-1); });
      on("t-plus", function () { bumpTimer(1); });

      var keys = document.getElementsByClassName("key");
      for (var i = 0; i < keys.length; i++) {
        (function (btn) {
          btn.onclick = function () { keyPress(btn.getAttribute("data-k")); };
        })(keys[i]);
      }

      renderHome();
    });
  }

  boot();
})();
</script>
</body>
</html>
